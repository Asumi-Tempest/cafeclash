<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Café Clash: Midnight Brew — Loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --midnight:#161029;
    --midnight-2:#241a44;
    --midnight-3:#3a2a63;
    --periwinkle:#8ab4e8;
    --lavender:#b39ddb;
    --caramel:#e8a765;
    --caramel-dark:#a8703a;
    --cream:#f7e8d4;
    --espresso:#3b2a20;
    --gold:#f0c46d;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    background:var(--midnight);
    overflow:hidden;
    font-family:'Quicksand',sans-serif;
  }
  .scene{
    position:relative;
    width:100%;
    height:100%;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 50% 18%, rgba(138,180,232,0.16), transparent 55%),
      linear-gradient(180deg, var(--midnight) 0%, var(--midnight-2) 55%, var(--midnight-3) 100%);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .ambient-glow{
    position:absolute;
    inset:-10%;
    background:radial-gradient(circle at 30% 25%, rgba(179,157,219,0.14), transparent 45%),
               radial-gradient(circle at 75% 70%, rgba(232,167,101,0.10), transparent 40%);
    animation:ambientDrift 16s ease-in-out infinite;
    pointer-events:none;
    transition:opacity 2s ease;
  }
  .day-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, #bfe0f5 0%, #eaf6ff 45%, #fde9c4 100%);
    opacity:0;
    transition:opacity 2.8s ease;
    pointer-events:none;
    z-index:0;
  }
  #scene.day .day-overlay{opacity:1;}
  #scene.day .ambient-glow{opacity:0;}
  @keyframes ambientDrift{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(-3%,2%) scale(1.08);}
  }
  .vignette{
    position:absolute;
    inset:0;
    background:radial-gradient(ellipse at 50% 42%, transparent 50%, rgba(8,5,18,0.55) 100%);
    pointer-events:none;
    z-index:1;
    transition:opacity 2s ease;
  }
  #scene.day .vignette{opacity:0.4;}
  .mute-btn{
    position:absolute;
    top:calc(16px + env(safe-area-inset-top,0px));
    right:16px;
    z-index:6;
    width:40px;height:40px;
    border-radius:50%;
    border:1.5px solid rgba(247,232,212,0.25);
    background:rgba(247,232,212,0.08);
    color:var(--cream);
    font-size:17px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .mute-btn:hover{background:rgba(247,232,212,0.16);}
  .cloud{
    position:absolute;
    left:0;
    border-radius:50%;
    background:rgba(247,232,212,0.06);
    filter:blur(8px);
    pointer-events:none;
    animation:driftCloud linear infinite;
  }
  @keyframes driftCloud{
    0%{transform:translateX(-15vw);}
    100%{transform:translateX(115vw);}
  }
  .day-cloud{
    position:absolute;
    left:0;
    background:#ffffff;
    border-radius:50%;
    opacity:0;
    filter:blur(0.3px);
    box-shadow:0 6px 14px rgba(120,130,160,0.12);
    transition:opacity 1.8s ease;
    pointer-events:none;
    animation:driftCloud linear infinite;
  }
  .day-cloud::before,.day-cloud::after{
    content:"";
    position:absolute;
    background:#ffffff;
    border-radius:50%;
  }
  .day-cloud::before{width:55%; height:110%; top:-35%; left:8%;}
  .day-cloud::after{width:45%; height:90%; top:-25%; right:10%;}
  #scene.day .day-cloud{opacity:0.9;}
  #scene.day .cloud{background:rgba(255,255,255,0.5); transition:background 2s ease;}

  .bird{
    position:absolute;
    left:0;
    width:22px; height:11px;
    opacity:0;
    pointer-events:none;
  }
  .bird::before,.bird::after{
    content:"";
    position:absolute;
    width:11px; height:11px;
    border-top:2px solid var(--espresso);
    border-radius:50% 50% 0 0;
    top:0;
  }
  .bird::before{left:0; transform-origin:100% 100%; animation:flapL 0.55s ease-in-out infinite;}
  .bird::after{left:9px; transform-origin:0% 100%; animation:flapR 0.55s ease-in-out infinite;}
  @keyframes flapL{0%,100%{transform:rotate(-8deg);} 50%{transform:rotate(-48deg);}}
  @keyframes flapR{0%,100%{transform:rotate(8deg);} 50%{transform:rotate(48deg);}}
  @keyframes flyAcross{
    0%{transform:translate(-10vw,10px); opacity:0.9;}
    8%{opacity:0.9;}
    92%{opacity:0.9;}
    30%{transform:translate(28vw,-16px);}
    60%{transform:translate(62vw,8px);}
    100%{transform:translate(115vw,-6px); opacity:0.9;}
  }
  .bird.flying{animation:flyAcross linear forwards;}

  /* stars */
  .star{
    position:absolute;
    width:3px;height:3px;
    background:var(--cream);
    border-radius:50%;
    opacity:0.7;
    animation:twinkle 3.2s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes twinkle{
    0%,100%{opacity:0.15; transform:scale(0.8);}
    50%{opacity:0.9; transform:scale(1.3);}
  }

  /* moon */
  .moon{
    position:absolute;
    top:8%; right:12%;
    width:52px; height:52px;
    border-radius:50%;
    background:var(--cream);
    box-shadow: -16px 4px 0 -2px var(--midnight-2), 0 0 34px 6px rgba(247,232,212,0.35);
    pointer-events:none;
    animation:moonGlow 5s ease-in-out infinite;
    transition:opacity 1.4s ease;
  }
  @keyframes moonGlow{
    0%,100%{box-shadow: -16px 4px 0 -2px var(--midnight-2), 0 0 30px 4px rgba(247,232,212,0.3);}
    50%{box-shadow: -16px 4px 0 -2px var(--midnight-2), 0 0 42px 10px rgba(247,232,212,0.5);}
  }
  .sun{
    position:absolute;
    top:9%; right:14%;
    width:64px; height:64px;
    border-radius:50%;
    background:radial-gradient(circle, #fff6d8, #ffcf6b);
    box-shadow:0 0 50px 14px rgba(255,207,107,0.55);
    opacity:0;
    pointer-events:none;
    transition:opacity 2s ease 0.4s;
  }
  #scene.day .moon{opacity:0;}
  #scene.day .sun{opacity:1;}
  #scene.day .star{opacity:0 !important; animation:none;}

  /* skyline */
  .skyline-back{
    position:absolute;
    bottom:0; left:0; right:0;
    height:20%;
    display:flex;
    align-items:flex-end;
    opacity:0.45;
    pointer-events:none;
    transition:filter 2s ease;
  }
  .bldg-back{
    background:var(--midnight-2);
    margin-right:3px;
    flex-shrink:0;
  }
  .skyline{
    position:absolute;
    bottom:0; left:0; right:0;
    height:26%;
    display:flex;
    align-items:flex-end;
    opacity:0.9;
    pointer-events:none;
    transition:filter 2s ease;
  }
  #scene.day .skyline,#scene.day .skyline-back{filter:brightness(1.6) saturate(0.5) hue-rotate(10deg);}
  .bldg{
    background:linear-gradient(180deg, var(--midnight-3), var(--midnight-2));
    margin-right:2px;
    position:relative;
    flex-shrink:0;
  }
  .bldg span{
    position:absolute;
    width:4px;height:4px;
    background:var(--gold);
    opacity:0.55;
  }

  /* steam + beans */
  .drift{
    position:absolute;
    pointer-events:none;
  }
  .bean{
    width:10px;height:14px;
    background:var(--espresso);
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    position:relative;
    opacity:0.5;
    animation:rise linear infinite;
  }
  .bean::after{
    content:"";
    position:absolute;
    top:2px;bottom:2px;left:50%;
    width:1px;
    background:rgba(247,232,212,0.5);
  }
  @keyframes rise{
    0%{transform:translateY(0) rotate(0deg); opacity:0;}
    10%{opacity:0.5;}
    90%{opacity:0.5;}
    100%{transform:translateY(-110vh) rotate(200deg); opacity:0;}
  }
  .steam{
    width:26px;height:26px;
    border:3px solid rgba(247,232,212,0.35);
    border-radius:50% 50% 50% 0;
    transform:rotate(45deg);
    animation:steamup 4.5s ease-in infinite;
    opacity:0;
  }
  @keyframes steamup{
    0%{transform:translateY(0) rotate(45deg) scale(0.6); opacity:0;}
    20%{opacity:0.5;}
    100%{transform:translateY(-90px) rotate(45deg) scale(1.15); opacity:0;}
  }

  /* content */
  .content{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
    padding:24px;
    text-align:center;
    max-width:520px;
    width:100%;
  }
  .logo-wrap{
    position:relative;
    animation:logoIn 1.1s cubic-bezier(.2,.9,.25,1) both;
  }
  @keyframes logoIn{
    0%{opacity:0; transform:translateY(-14px) scale(0.92);}
    100%{opacity:1; transform:translateY(0) scale(1);}
  }
  .logo-glow{
    position:absolute;
    left:50%; top:50%;
    width:75%;
    aspect-ratio:1;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(232,167,101,0.32), transparent 70%);
    filter:blur(22px);
    animation:glowPulse 3.6s ease-in-out infinite;
    z-index:-1;
  }
  @keyframes glowPulse{
    0%,100%{opacity:0.45; transform:translate(-50%,-50%) scale(0.9);}
    50%{opacity:0.85; transform:translate(-50%,-50%) scale(1.06);}
  }
  .logo-float{
    animation:logoFloat 4.6s ease-in-out infinite;
  }
  @keyframes logoFloat{
    0%,100%{transform:translateY(0) rotate(-1deg);}
    50%{transform:translateY(-9px) rotate(1deg);}
  }
  .logo-wrap img{
    width:min(78vw, 420px);
    display:block;
    filter:drop-shadow(0 10px 26px rgba(0,0,0,0.45));
  }

  .tip{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:clamp(15px, 3.6vw, 19px);
    color:var(--cream);
    min-height:2.6em;
    display:flex;
    align-items:center;
    justify-content:center;
    line-height:1.35;
    padding:0 8px;
    transition:opacity 0.4s ease;
  }

  .loader-row{
    display:flex;
    align-items:center;
    gap:18px;
  }

  .cup{
    width:58px;
    height:76px;
    border:4px solid var(--cream);
    border-top:none;
    border-radius:0 0 20px 20px;
    position:relative;
    overflow:hidden;
    background:rgba(255,255,255,0.04);
    flex-shrink:0;
  }
  .cup-lid{
    width:66px;
    height:9px;
    background:var(--cream);
    border-radius:4px;
    margin:0 auto -1px;
    position:relative;
    z-index:1;
  }
  .liquid{
    position:absolute;
    left:0; right:0; bottom:0;
    height:0%;
    background:linear-gradient(180deg, var(--caramel), var(--caramel-dark));
    transition:height 0.35s ease-out;
  }
  .liquid::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:4px;
    background:var(--gold);
    opacity:0.7;
  }

  .progress-track{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:8px;
    min-width:0;
  }
  .bar-outer{
    width:100%;
    height:10px;
    border-radius:999px;
    background:rgba(247,232,212,0.14);
    border:1.5px solid rgba(247,232,212,0.25);
    overflow:hidden;
  }
  .bar-inner{
    height:100%;
    width:0%;
    border-radius:999px;
    background:linear-gradient(90deg, var(--periwinkle), var(--lavender));
    transition:width 0.35s ease-out;
  }
  .status-row{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    letter-spacing:0.02em;
    color:var(--lavender);
    font-weight:600;
  }

  .enter-btn{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:16px;
    color:var(--espresso);
    background:linear-gradient(180deg, var(--gold), var(--caramel));
    border:none;
    border-radius:999px;
    padding:12px 34px;
    cursor:pointer;
    opacity:0;
    transform:translateY(8px) scale(0.96);
    pointer-events:none;
    transition:opacity 0.4s ease, transform 0.4s ease;
    box-shadow:0 8px 20px rgba(232,167,101,0.35);
  }
  .enter-btn.show{
    opacity:1;
    transform:translateY(0) scale(1);
    pointer-events:auto;
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 8px 20px rgba(232,167,101,0.35);}
    50%{box-shadow:0 8px 28px rgba(232,167,101,0.6);}
  }
  .enter-btn:active{transform:scale(0.96);}

  /* ---- auth screen ---- */
  .auth-screen{
    position:relative;
    z-index:5;
    width:100%;
    max-width:360px;
    display:none;
    flex-direction:column;
    align-items:stretch;
    gap:16px;
    padding:26px 24px;
    background:rgba(15,10,28,0.5);
    backdrop-filter:blur(8px);
    border:1px solid rgba(247,232,212,0.14);
    border-radius:22px;
    animation:logoIn 0.5s cubic-bezier(.2,.9,.25,1) both;
    isolation:isolate;
  }
  .auth-screen.show{display:flex;}
  .auth-title{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:20px;
    color:var(--cream);
    text-align:center;
    margin:0 0 2px;
  }
  .auth-sub{
    font-size:13px;
    color:var(--lavender);
    text-align:center;
    margin:0;
    line-height:1.4;
  }
  .auth-tabs{
    display:flex;
    background:rgba(247,232,212,0.08);
    border:1.5px solid rgba(247,232,212,0.2);
    border-radius:999px;
    padding:4px;
    gap:4px;
  }
  .auth-tab{
    flex:1;
    border:none;
    background:transparent;
    color:var(--lavender);
    font-family:'Quicksand',sans-serif;
    font-weight:700;
    font-size:13px;
    padding:8px 0;
    border-radius:999px;
    cursor:pointer;
  }
  .auth-tab.active{
    background:linear-gradient(180deg, var(--periwinkle), var(--lavender));
    color:var(--espresso);
  }
  .auth-field{
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .auth-field label{
    font-size:12px;
    color:var(--lavender);
    font-weight:600;
  }
  .auth-field input{
    background:rgba(247,232,212,0.08);
    border:1.5px solid rgba(247,232,212,0.25);
    border-radius:10px;
    padding:10px 12px;
    color:var(--cream);
    font-family:'Quicksand',sans-serif;
    font-size:14px;
    outline:none;
    letter-spacing:0.02em;
  }
  #authOtp{
    text-align:center;
    letter-spacing:0.4em;
    font-size:20px;
    font-weight:700;
  }
  .auth-field input:focus{border-color:var(--periwinkle);}
  #emailStep, #otpStep{
    display:flex;
    flex-direction:column;
    gap:14px;
    width:100%;
  }
  .auth-submit{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:15px;
    color:var(--espresso);
    background:linear-gradient(180deg, var(--gold), var(--caramel));
    border:none;
    border-radius:10px;
    padding:11px 0;
    width:100%;
    cursor:pointer;
  }
  .auth-submit:disabled{opacity:0.6; cursor:default;}
  .auth-links{
    display:flex;
    justify-content:space-between;
  }
  .guest-link{
    text-align:center;
    background:none;
    border:none;
    color:var(--lavender);
    font-family:'Quicksand',sans-serif;
    font-size:13px;
    text-decoration:none;
    cursor:pointer;
    padding:4px 0 0;
  }
  .guest-link:hover{text-decoration:underline;}
  .auth-status{
    text-align:center;
    font-size:12px;
    min-height:1.4em;
    color:var(--caramel);
  }

  @media (prefers-reduced-motion: reduce){
    .star,.bean,.steam,.cloud,.moon,.logo-wrap,.logo-glow,.logo-float,.ambient-glow,.enter-btn.show{animation:none !important;}
  }
</style>
</head>

      <button class="auth-tab" id="tabSignup" type="button">Sign Up</button>
    </div>

      </div>

        <input type="email" id="authEmail" autocomplete="email" required placeholder="you@gmail.com">

    </form>

<script src="cloud.js"></script>
<script>
(function(){
  // stars
  var scene = document.getElementById('scene');
  for(var i=0;i<28;i++){
    var s = document.createElement('div');
    s.className='star';
    s.style.left = Math.random()*100+'%';
    s.style.top = (Math.random()*55)+'%';
    s.style.animationDelay = (Math.random()*3)+'s';
    scene.appendChild(s);
  }
  // beans
  for(var b=0;b<7;b++){
    var d = document.createElement('div');
    d.className='drift bean';
    d.style.left = (5+Math.random()*90)+'%';
    d.style.bottom = '-5%';
    d.style.animationDuration = (7+Math.random()*6)+'s';
    d.style.animationDelay = (Math.random()*8)+'s';
    scene.appendChild(d);
  }
  // steam
  for(var st=0;st<4;st++){
    var w = document.createElement('div');
    w.className='drift steam';
    w.style.left = (30+Math.random()*40)+'%';
    w.style.bottom = '4%';
    w.style.animationDuration = (4+Math.random()*2)+'s';
    w.style.animationDelay = (Math.random()*4)+'s';
    scene.appendChild(w);
  }
  // skyline
  var sky = document.getElementById('skyline');
  var n = 22;
  for(var k=0;k<n;k++){
    var bl = document.createElement('div');
    bl.className='bldg';
    var h = 30+Math.random()*70;
    var w2 = 100/n;
    bl.style.height = h+'%';
    bl.style.width = w2+'%';
    if(Math.random()<0.5){
      var win = document.createElement('span');
      win.style.left = (20+Math.random()*60)+'%';
      win.style.top = (15+Math.random()*60)+'%';
      bl.appendChild(win);
    }
    sky.appendChild(bl);
  }

  // back skyline (parallax layer, faded + fewer windows)
  var skyBack = document.getElementById('skylineBack');
  var nBack = 12;
  for(var kb=0;kb<nBack;kb++){
    var blb = document.createElement('div');
    blb.className='bldg-back';
    blb.style.height = (25+Math.random()*60)+'%';
    blb.style.width = (100/nBack)+'%';
    skyBack.appendChild(blb);
  }

  // clouds
  for(var c=0;c<5;c++){
    var cl = document.createElement('div');
    cl.className='cloud';
    var cw = 70+Math.random()*90;
    cl.style.width = cw+'px';
    cl.style.height = (cw*0.4)+'px';
    cl.style.top = (6+Math.random()*30)+'%';
    cl.style.animationDuration = (35+Math.random()*25)+'s';
    cl.style.animationDelay = (Math.random()*-30)+'s';
    scene.appendChild(cl);
  }

  // puffy day clouds (hidden until day mode fades them in)
  for(var dc=0;dc<4;dc++){
    var dcl = document.createElement('div');
    dcl.className='day-cloud';
    var dw = 90+Math.random()*110;
    dcl.style.width = dw+'px';
    dcl.style.height = (dw*0.42)+'px';
    dcl.style.top = (5+Math.random()*24)+'%';
    dcl.style.animationDuration = (45+Math.random()*30)+'s';
    dcl.style.animationDelay = (Math.random()*-45)+'s';
    scene.appendChild(dcl);
  }

  // birds — spawned only once day mode starts
  function spawnBirds(){
    var count = 1 + Math.floor(Math.random()*2);
    for(var bi=0; bi<count; bi++){
      var bird = document.createElement('div');
      bird.className = 'bird flying';
      bird.style.top = (12+Math.random()*22)+'%';
      var dur = 13+Math.random()*8;
      bird.style.animationDuration = dur+'s';
      bird.style.animationDelay = (bi*1.4)+'s';
      scene.appendChild(bird);
      setTimeout(function(el){ el.remove(); }, (dur + bi*1.4 + 0.5) * 1000, bird);
    }
  }
  var birdInterval = null;
  function startBirds(){
    spawnBirds();
    birdInterval = setInterval(spawnBirds, 12000);
  }

  // background music — started explicitly by the Start button (guarantees a user gesture)
  var bgm = document.getElementById('bgm');
  var muteBtn = document.getElementById('muteBtn');
  var musicMuted = localStorage.getItem('cc_music_muted') === 'true';
  bgm.volume = 0.5;
  bgm.muted = musicMuted;
  muteBtn.textContent = musicMuted ? '🔇' : '🔊';

  function startMusic(){
    if(!musicMuted){
      bgm.play().catch(function(){ /* blocked — muteBtn click below will retry */ });
    }
  }

  muteBtn.addEventListener('click', function(e){
    e.stopPropagation();
    musicMuted = !musicMuted;
    bgm.muted = musicMuted;
    muteBtn.textContent = musicMuted ? '🔇' : '🔊';
    localStorage.setItem('cc_music_muted', musicMuted);
    if(!musicMuted){ bgm.play().catch(function(){}); }
  });

  // tips
  var tips = [
    "Astral Roast is flowing through the city&hellip;",
    "Kairo's coffee cup just bonded with the Espresso Core.",
    "A corrupted Mop Spear is more dangerous than it sounds.",
    "The Corporation wants every café under one roof.",
    "Underground tournaments hide beneath Neon Boba Street.",
    "Ten chapters. Ten café workers. One midnight shift.",
    "The Brew Station never runs out of surprises.",
    "Speed decides who swings first in the Midnight Brew."
  ];
  var tipEl = document.getElementById('tip');
  var tipIdx = 0;
  function rotateTip(){
    tipEl.style.opacity = 0;
    setTimeout(function(){
      tipIdx = (tipIdx+1) % tips.length;
      tipEl.innerHTML = tips[tipIdx];
      tipEl.style.opacity = 1;
    }, 350);
  }
  setInterval(rotateTip, 3200);

  // progress
  var liquid = document.getElementById('liquid');
  var bar = document.getElementById('bar');
  var pct = document.getElementById('percentText');
  var statusText = document.getElementById('statusText');
  var enterBtn = document.getElementById('enterBtn');
  var statuses = ["Brewing your shift","Grinding the beans","Waking the equipment","Charging the Astral Roast","Almost ready"];
  var progress = 0;
  function tick(){
    if(progress >= 100){
      progress = 100;
      statusText.textContent = "Ready to brew";
      setTimeout(function(){
        loaderRow.style.opacity = 0;
        setTimeout(function(){
          loaderRow.style.display = 'none';
          enterBtn.textContent = "Start";
          enterBtn.dataset.mode = 'start';
          enterBtn.classList.add('show');
        }, 350);
      }, 500);
    } else {
      progress += Math.random()*9 + 3;
      if(progress>100) progress = 100;
      var sIdx = Math.min(statuses.length-1, Math.floor(progress/100*statuses.length));
      statusText.textContent = statuses[sIdx];
      setTimeout(tick, 220 + Math.random()*260);
    }
    liquid.style.height = progress+'%';
    bar.style.width = progress+'%';
    pct.textContent = Math.floor(progress)+'%';
  }
  setTimeout(tick, 500);

  enterBtn.addEventListener('click', function(){
    if(enterBtn.dataset.mode === 'start'){
      startMusic();
      scene.classList.add('day');
      startBirds();
      enterBtn.classList.remove('show');
      autoLoginOrReveal();
    } else {
      startGame(currentUser);
    }
  });

  // =====================================================
  // CONFIG — fill these in
  // =====================================================
  var CONFIG = {
    APPS_SCRIPT_URL: (typeof CLOUD !== "undefined" ? CLOUD.url : "")
  };

  var currentUser = null;
  var pendingEmail = '';
  var authScreen = document.getElementById('authScreen');
  var loaderRow = document.querySelector('.loader-row');
  var emailStep = document.getElementById('emailStep');
  var otpStep = document.getElementById('otpStep');
  var authStatus = document.getElementById('authStatus');
  var sendCodeBtn = document.getElementById('sendCodeBtn');
  var verifyBtn = document.getElementById('verifyBtn');
  var tabLogin = document.getElementById('tabLogin');
  var tabSignup = document.getElementById('tabSignup');
  var nameField = document.getElementById('nameField');
  var authSub = document.getElementById('authSub');

  function setMode(mode){
    tabLogin.classList.toggle('active', mode === 'login');
    tabSignup.classList.toggle('active', mode === 'signup');
    nameField.style.display = mode === 'signup' ? 'flex' : 'none';
    authSub.textContent = mode === 'signup'
      ? "Enter your name and email — we'll send a 6-digit code to confirm it's you."
      : "Enter your email — we'll send a 6-digit code. No password to remember.";
  }
  tabLogin.addEventListener('click', function(){ setMode('login'); });
  tabSignup.addEventListener('click', function(){ setMode('signup'); });

  function autoLoginOrReveal(){
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem('cc_session') || 'null'); } catch(e){}
    if(saved && saved.email && saved.token){ tipEl.style.opacity = 0; loaderRow.style.opacity = 0; setTimeout(function(){ loaderRow.style.display = 'none'; onAuthSuccess(saved); }, 350); }
    else { revealAuth(); }
  }

  function revealAuth(){
    tipEl.style.opacity = 0;
    loaderRow.style.opacity = 0;
    setTimeout(function(){
      tipEl.style.display = 'none';
      loaderRow.style.display = 'none';
      authScreen.classList.add('show');
    }, 350);
  }

  function setStatus(msg, isError){
    authStatus.textContent = msg;
    authStatus.style.color = isError ? '#e88787' : 'var(--caramel)';
  }

  function callBackend(payload){
    return fetch(CONFIG.APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight on Apps Script
      body: JSON.stringify(payload)
    }).then(function(res){ return res.json(); });
  }

  function onAuthSuccess(user){
    currentUser = user;
    localStorage.setItem('cc_session', JSON.stringify(user));
    window.__cloudP = (!user.guest && typeof CLOUD !== 'undefined') ? CLOUD.load() : Promise.resolve();
    authScreen.classList.remove('show');
    document.querySelector('.tip').style.display = 'flex';
    document.querySelector('.tip').textContent = "Welcome, " + (user.name || user.email) + "!";
    document.querySelector('.tip').style.opacity = 1;
    enterBtn.textContent = "Enter Café";
    enterBtn.dataset.mode = 'enter';
    enterBtn.classList.add('show');
    if(!document.getElementById('logoutBtn')){
      var lo = document.createElement('button');
      lo.id = 'logoutBtn'; lo.type = 'button'; lo.className = 'guest-link';
      lo.textContent = user.guest ? 'Back to log in' : 'Not you? Switch account';
      lo.addEventListener('click', function(){ if(!user.guest && typeof CLOUD !== 'undefined') CLOUD.clearLocal(); localStorage.removeItem('cc_session'); location.reload(); });
      enterBtn.insertAdjacentElement('afterend', lo);
    }
  }

  // Step 1: send the code
  document.getElementById('emailStep').addEventListener('submit', function(e){
    e.preventDefault();
    var email = document.getElementById('authEmail').value.trim();
    var name = document.getElementById('authName').value.trim();
    var mode = tabSignup.classList.contains('active') ? 'signup' : 'login';
    pendingEmail = email;
    sendCodeBtn.disabled = true;
    setStatus('Sending your code…', false);
    callBackend({ action: 'sendOtp', email: email, name: name, mode: mode }).then(function(res){
      sendCodeBtn.disabled = false;
      if(res.ok){
        setStatus('Code sent — check ' + email, false);
        emailStep.style.display = 'none';
        otpStep.style.display = 'flex';
        document.getElementById('authOtp').focus();
      } else {
        setStatus(res.error || 'Could not send the code.', true);
      }
    }).catch(function(){
      sendCodeBtn.disabled = false;
      setStatus('Could not reach the backend. Check APPS_SCRIPT_URL.', true);
    });
  });

  // Step 2: verify the code
  otpStep.addEventListener('submit', function(e){
    e.preventDefault();
    var code = document.getElementById('authOtp').value.trim();
    verifyBtn.disabled = true;
    setStatus('Checking your code…', false);
    callBackend({ action: 'verifyOtp', email: pendingEmail, code: code }).then(function(res){
      verifyBtn.disabled = false;
      if(res.ok){
        onAuthSuccess(res.user);
      } else {
        setStatus(res.error || 'That code didn\'t match.', true);
      }
    }).catch(function(){
      verifyBtn.disabled = false;
      setStatus('Could not reach the backend. Check APPS_SCRIPT_URL.', true);
    });
  });

  document.getElementById('resendBtn').addEventListener('click', function(){
    var mode = tabSignup.classList.contains('active') ? 'signup' : 'login';
    setStatus('Resending…', false);
    callBackend({ action: 'sendOtp', email: pendingEmail, name: document.getElementById('authName').value.trim(), mode: mode }).then(function(res){
      setStatus(res.ok ? 'New code sent — check ' + pendingEmail : (res.error || 'Could not resend.'), !res.ok);
    });
  });

  document.getElementById('changeEmailBtn').addEventListener('click', function(){
    otpStep.style.display = 'none';
    emailStep.style.display = 'flex';
    setStatus('', false);
  });

  document.getElementById('guestBtn').addEventListener('click', function(){
    onAuthSuccess({ email: null, name: 'Guest Barista', guest: true });
  });

  // Replace this with your actual game bootstrap
  function startGame(user){
    enterBtn.textContent = 'Loading your save…'; enterBtn.disabled = true;
    Promise.race([window.__cloudP || Promise.resolve(), new Promise(function(r){ setTimeout(r, 5000); })]).then(function(){ window.location.href = 'main.html'; });
  }
})();
</script>
<script src="music.js"></script>
<script>
(function(){
  var b = document.getElementById('bgm'), src = b.querySelector('source');
  function fallback(){ MUSIC.play('login', {button:false}); }
  if (src) src.addEventListener('error', fallback);
  b.addEventListener('playing', function(){ MUSIC.notice('Playing ' + decodeURIComponent(b.currentSrc).split('/').slice(-2).join('/'), true); });
  setTimeout(function(){ if (b.networkState === 3 || b.error) fallback(); }, 1500);
  document.getElementById('muteBtn').addEventListener('click', function(){ setTimeout(MUSIC.refreshMute, 0); });
  // Browsers block sound until the first click/key press, so start the song on the first one anywhere on the page.
  var mb = document.getElementById('muteBtn'), kicked = false;
  function kick(e){
    if (kicked || (e.target && e.target.closest && e.target.closest('#muteBtn'))) return;
    kicked = true;
    if (localStorage.getItem('cc_music_muted') !== 'true') b.play().catch(function(){});
  }
  ['pointerdown','keydown','touchstart'].forEach(function(ev){ window.addEventListener(ev, kick, {passive:true}); });
  // If the song isn't playing yet, the speaker button starts it (instead of muting a silent page).
  mb.addEventListener('click', function(e){
    if (localStorage.getItem('cc_music_muted') !== 'true' && b.paused && !b.error && b.networkState !== 3) { e.stopImmediatePropagation(); kicked = true; b.play().catch(function(){}); }
  }, true);
  window.addEventListener('pagehide', function(){
    try { if (!b.paused) localStorage.setItem('cc_music_state', JSON.stringify({file:'audios/doki-doki.mp3', time:b.currentTime, t:Date.now()})); } catch(e){}
  });
})();
</script>
