<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Café Clash: Midnight Brew — Expedition Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Quicksand:wght@600;750&display=swap" rel="stylesheet">
<style>
  :root {
    --wood-dark: #6c4228;
    --wood-main: #b88654;
    --wood-light: #e3bc88;
    --wood-border: #422413;
    --cream-bg: #fdf5e6;
    --green-accent: #7ca968;
    --gold: #e6b84c;
    --text-brown: #331a0d;
  }
  * { box-sizing: border-box; }
  
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    background: linear-gradient(135deg, #a4c988, #679d67);
    overflow: hidden;
    font-family: 'Quicksand', sans-serif;
    color: var(--text-brown);
    user-select: none;
  }

  .map-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 25px 35px;
    background: radial-gradient(circle at 50% 40%, rgba(184, 214, 156, 0.9) 0%, rgba(103, 157, 103, 0.95) 80%);
    overflow: hidden;
    animation: fadeInContainer 0.4s ease-out;
  }
  @keyframes fadeInContainer {
    from { opacity: 0; transform: scale(0.98); }
    to { opacity: 1; transform: scale(1); }
  }

  /* --- FLOATING NATURE PARTICLES --- */
  .bg-particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }
  .particle {
    position: absolute;
    bottom: -20px;
    background: #e6f2dc;
    border-radius: 50%;
    opacity: 0.35;
    animation: floatLeaf 8s infinite linear;
  }
  @keyframes floatLeaf {
    0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
    20% { opacity: 0.5; }
    80% { opacity: 0.5; }
    100% { transform: translateY(-110vh) translateX(30px) rotate(360deg); opacity: 0; }
  }

  /* --- WOODEN TOP NAVIGATION BAR --- */
  .top-bar {
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--wood-main);
    border: 4px solid var(--wood-border);
    border-radius: 12px;
    padding: 12px 25px;
    box-shadow: 0 6px 0 var(--wood-dark), 0 10px 20px rgba(0,0,0,0.3);
    animation: slideDownBar 0.4s ease-out;
  }
  @keyframes slideDownBar {
    from { transform: translateY(-30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .chapter-tabs {
    display: flex;
    gap: 15px;
    font-family: 'Baloo 2', sans-serif;
    font-size: 16px;
  }
  .tab {
    background: var(--wood-dark);
    color: var(--wood-light);
    padding: 4px 14px;
    border-radius: 8px;
    border: 2px solid var(--wood-border);
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .tab:hover { background: var(--wood-border); color: #fff; }
  .tab.active {
    background: var(--gold);
    color: var(--text-brown);
    border-color: var(--wood-border);
    transform: translateY(-2px);
    box-shadow: 0 4px 0 var(--wood-dark);
  }

  /* --- INTERACTIVE MAP GRID --- */
  .node-grid-area {
    position: relative;
    flex-grow: 1;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 0 40px;
    z-index: 5;
  }

  /* Wooden UI Node Panels */
  .story-node {
    width: 290px;
    background: var(--cream-bg);
    border: 4px solid var(--wood-border);
    border-radius: 16px;
    padding: 16px;
    cursor: pointer;
    box-shadow: 0 8px 0 var(--wood-dark), 0 14px 25px rgba(0,0,0,0.3);
    transition: transform 0.25s ease, box-shadow 0.2s ease;
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    gap: 8px;
    animation: nodeSlideUp 0.5s ease backwards;
  }
  .story-node:nth-child(1) { animation-delay: 0.1s; }
  .story-node:nth-child(2) { animation-delay: 0.2s; }
  .story-node:nth-child(3) { animation-delay: 0.3s; }

  @keyframes nodeSlideUp {
    from { opacity: 0; transform: translateY(40px) scale(0.9); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .story-node:hover:not(.locked) {
    transform: translateY(-8px);
    box-shadow: 0 12px 0 var(--wood-dark), 0 18px 30px rgba(0,0,0,0.35);
  }
  .story-node:active:not(.locked) {
    transform: translateY(-2px);
    box-shadow: 0 4px 0 var(--wood-dark);
  }

  .story-node.locked {
    opacity: 0.5;
    background: #e0d5c1;
    filter: grayscale(0.5);
    cursor: not-allowed;
  }

  .node-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px dashed #d1bfa7;
    padding-bottom: 6px;
  }

  .node-tag {
    font-size: 11px;
    font-weight: 800;
    color: var(--wood-dark);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .node-status-badge {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid var(--wood-border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: bold;
  }

  .status-completed { background: #7ca968; color: #fff; }
  .status-unlocked { background: var(--gold); color: var(--text-brown); animation: pulseGold 2s infinite ease-in-out; }
  .status-locked { background: #b0a490; color: #555; }

  @keyframes pulseGold {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }

  .node-title {
    font-family: 'Baloo 2', sans-serif;
    font-size: 16px;
    font-weight: 800;
    color: var(--wood-border);
    line-height: 1.2;
  }

  .node-desc {
    font-size: 12px;
    color: #614631;
    line-height: 1.3;
  }

  /* --- WOODEN BOTTOM FOOTER --- */
  .map-footer {
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--wood-main);
    border: 4px solid var(--wood-border);
    border-radius: 12px;
    padding: 10px 20px;
    box-shadow: 0 6px 0 var(--wood-dark), 0 10px 20px rgba(0,0,0,0.3);
    animation: slideUpFooter 0.4s ease-out;
  }
  @keyframes slideUpFooter {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .wood-btn {
    background: var(--wood-dark);
    border: 2px solid var(--wood-border);
    color: var(--wood-light);
    padding: 8px 18px;
    border-radius: 8px;
    font-family: 'Baloo 2', sans-serif;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--wood-border);
    transition: all 0.1s ease;
  }
  .wood-btn:hover { background: var(--wood-border); color: #fff; }
  .wood-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--wood-border); }
</style>
<link rel="stylesheet" href="theme.css">
</head>
<body>

<div class="map-container">

  <!-- Background Floating Leaves / Sprout Particles -->
  <div class="bg-particles" id="particleContainer"></div>

  <!-- Top Wooden Bar -->
  <div class="top-bar">
    <div style="font-family: 'Baloo 2', sans-serif; font-size: 20px; font-weight: 800; color: var(--cream-bg);">🪵 Brew Expedition Map</div>
    <div class="chapter-tabs" id="chapterTabs"></div>
    <div id="walletTxt" style="font-size: 14px; font-weight: 800; color: var(--cream-bg); font-family: 'Baloo 2', sans-serif;">🪙 0 &nbsp; 💎 150</div>
  </div>

  <!-- Interactive Nodes Grid -->
  <div class="node-grid-area" id="nodeContainer"></div>

  <!-- Bottom Wooden Bar -->
  <div class="map-footer">
    <button class="wood-btn" onclick="window.location.href='main.html'">◀ Back to Lobby</button>
    <div id="progressText" style="font-weight: 700; color: var(--cream-bg);">Progress: Chapter 1 (1/3 Cleared)</div>
    <div style="color: var(--wood-light); font-weight: 700;">Select an unlocked stage to begin!</div>
  </div>

</div>

<script src="campaign.js"></script>
<script>
  function initParticles() {
    const container = document.getElementById("particleContainer");
    for (let i = 0; i < 20; i++) {
      let p = document.createElement("div");
      p.className = "particle";
      let size = (Math.random() * 8 + 4) + "px";
      p.style.width = size;
      p.style.height = size;
      p.style.left = Math.random() * 100 + "vw";
      p.style.animationDuration = (Math.random() * 6 + 7) + "s";
      p.style.animationDelay = (Math.random() * 5) + "s";
      container.appendChild(p);
    }
  }

  let activeChapter = +(localStorage.getItem("active_chapter") || 1);
  function renderMap() {
    const box = document.getElementById("nodeContainer"); box.innerHTML = "";
    const C = CH[activeChapter - 1];
    let done = 0;
    for (let l = 1; l <= 5; l++) {
      const id = CC.id(activeChapter, l), st = CC.state(id), n = CC.node(id);
      if (st === "completed") done++;
      const type = l === 5 ? "Boss Node" : l === 1 ? "Story + Combat" : "Combat Node";
      const title = l === 5 ? "Boss: " + C.boss.map(b => b[0]).join(" & ") : l === 1 ? "Opening: " + C.t : "Clash: " + n.waves[0][0];
      const badge = st === "completed" ? ["status-completed", "✔"] : st === "unlocked" ? ["status-unlocked", "▶"] : ["status-locked", "🔒"];
      const el = document.createElement("div");
      el.className = "story-node " + (st === "locked" ? "locked" : "");
      el.innerHTML = '<div class="node-header"><span class="node-tag">' + type + '</span><div class="node-status-badge ' + badge[0] + '">' + badge[1] + '</div></div><div class="node-title">#0' + l + ' — ' + title + '</div><div class="node-desc">' + C.set + ' · ' + n.waves.length + (n.waves.length > 1 ? ' waves' : ' wave') + '</div>';
      if (st !== "locked") el.onclick = () => { localStorage.setItem("current_node", id); localStorage.setItem("story_phase", "pre"); location.href = "story.html"; };
      box.appendChild(el);
    }
    document.getElementById("progressText").innerText = "Chapter " + activeChapter + ": " + C.t + " (" + done + "/5 Cleared)";
  }
  function renderTabs() {
    const t = document.getElementById("chapterTabs"); t.innerHTML = "";
    CH.forEach((c, k) => {
      const open = CC.state(CC.id(k + 1, 1)) !== "locked";
      const d = document.createElement("div");
      d.className = "tab" + (k + 1 === activeChapter ? " active" : "");
      d.innerText = open ? "Ch. " + (k + 1) : "Ch. " + (k + 1) + " 🔒";
      d.title = c.t;
      if (!open) d.style.opacity = "0.6";
      d.onclick = () => open ? switchChapter(k + 1) : alert("🔒 Clear the previous chapter's boss first!");
      t.appendChild(d);
    });
  }
  function switchChapter(n) { activeChapter = n; localStorage.setItem("active_chapter", n); renderTabs(); renderMap(); }
  initParticles(); renderTabs(); renderMap();
</script>

<script src="cloud.js"></script>
<script src="music.js"></script>
<script>MUSIC.play("menu");</script>
<script>try{var g=JSON.parse(localStorage.getItem("cafe_clash_gacha")||"null")||{};document.getElementById("walletTxt").textContent="🪙 "+(g.coins||0).toLocaleString()+"   💎 "+(g.gems===undefined?150:g.gems);}catch(e){}</script>
</body>
</html>
