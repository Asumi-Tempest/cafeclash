<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Café Clash: Midnight Brew — Combat Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Quicksand:wght@600;750&display=swap" rel="stylesheet">
<style>
  :root {
    --wood-dark: #6c4228;
    --wood-main: #b88654;
    --wood-light: #e3bc88;
    --wood-border: #422413;
    --cream-bg: #fdf5e6;
    --green-accent: #7ca968;
    --gold: #e6b84c;
    --danger: #d9534f;
    --text-brown: #331a0d;
  }
  * { box-sizing: border-box; }
  
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    background: linear-gradient(135deg, #a4c988, #679d67);
    overflow: hidden;
    font-family: 'Quicksand', sans-serif;
    color: var(--text-brown);
    user-select: none;
  }

  .battlefield {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 20px 30px;
    background: radial-gradient(circle at 50% 40%, rgba(184, 214, 156, 0.9) 0%, rgba(103, 157, 103, 0.95) 80%);
    overflow: hidden;
  }

  .battlefield.shake { animation: arenaShake 0.3s ease-in-out; }
  @keyframes arenaShake {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-6px, 4px); }
    40% { transform: translate(5px, -4px); }
    60% { transform: translate(-4px, -2px); }
    80% { transform: translate(3px, 5px); }
  }

  .top-hud {
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--wood-main);
    border: 4px solid var(--wood-border);
    border-radius: 12px;
    padding: 10px 20px;
    box-shadow: 0 6px 0 var(--wood-dark), 0 10px 20px rgba(0,0,0,0.3);
  }

  .hp-bar-container {
    width: 200px;
    height: 14px;
    background: #422413;
    border-radius: 7px;
    border: 2px solid var(--wood-border);
    overflow: hidden;
    margin-top: 3px;
  }

  .hp-fill { width: 100%; height: 100%; background: var(--green-accent); transition: width 0.4s ease; }
  .enemy-hp-fill { width: 100%; height: 100%; background: var(--danger); transition: width 0.4s ease; }

  .combat-stage {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 120px;
    pointer-events: none;
  }

  .mc-fighter-card {
    background: var(--cream-bg);
    border: 4px solid var(--wood-border);
    border-radius: 16px;
    padding: 16px 22px;
    text-align: center;
    box-shadow: 0 8px 0 var(--wood-dark), 0 15px 30px rgba(0,0,0,0.35);
    animation: floatFighter 4s ease-in-out infinite;
  }
  @keyframes floatFighter {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .fighter-icon { font-size: 55px; min-height: 70px; display: flex; align-items: center; justify-content: center; }
  .fighter-name { font-family: 'Baloo 2', sans-serif; font-size: 14px; color: var(--wood-border); font-weight: bold; margin-top: 4px; }

  .enemy-stage {
    text-align: center;
    position: relative;
    animation: floatEnemy 3.5s ease-in-out infinite;
  }
  @keyframes floatEnemy {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-12px) scale(1.02); }
  }

  .enemy-intent-badge {
    position: absolute;
    top: -55px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--wood-dark);
    border: 3px solid var(--wood-border);
    border-radius: 50%;
    width: 48px;
    height: 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 0 var(--wood-border);
    z-index: 12;
  }
  .intent-icon { font-size: 14px; line-height: 1; }
  .intent-countdown { font-family: 'Baloo 2', sans-serif; font-size: 14px; font-weight: 800; color: #fff; line-height: 1; }

  .enemy-avatar {
    font-size: 130px;
    min-height: 130px;
    display: flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.4));
    transition: transform 0.2s ease;
  }
  .enemy-avatar.hit { transform: scale(1.15) rotate(5deg); filter: brightness(1.4); }

  #floatingText {
    position: absolute;
    top: -85px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Baloo 2', sans-serif;
    font-size: 34px;
    font-weight: 800;
    color: var(--gold);
    opacity: 0;
    z-index: 20;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    pointer-events: none;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translate(-50%, 0) scale(0.8); }
    50% { transform: translate(-50%, -45px) scale(1.2); }
    100% { opacity: 0; transform: translate(-50%, -70px) scale(1); }
  }
  .animate-float { animation: floatUp 0.7s ease-out forwards; }

  #attackProjectile {
    position: absolute;
    font-size: 45px;
    z-index: 25;
    opacity: 0;
    pointer-events: none;
  }
  @keyframes shootProjectile {
    0% { opacity: 1; left: 22%; top: 52%; transform: scale(0.5) rotate(0deg); }
    70% { opacity: 1; transform: scale(1.3) rotate(360deg); }
    100% { opacity: 0; left: 72%; top: 48%; transform: scale(1) rotate(720deg); }
  }
  .animate-projectile { animation: shootProjectile 0.45s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

  .bottom-hud {
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    width: 100%;
  }

  .ep-meter {
    background: var(--wood-main);
    border: 4px solid var(--wood-border);
    border-radius: 14px;
    padding: 12px 20px;
    text-align: center;
    box-shadow: 0 6px 0 var(--wood-dark), 0 10px 20px rgba(0,0,0,0.3);
  }
  .ep-number { font-family: 'Baloo 2', sans-serif; font-size: 30px; font-weight: 800; color: var(--cream-bg); line-height: 1; }

  .card-hand { display: flex; gap: 15px; }

  .combat-card {
    width: 150px;
    height: 210px;
    background: var(--cream-bg);
    border: 4px solid var(--wood-border);
    border-radius: 14px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    cursor: pointer;
    box-shadow: 0 8px 0 var(--wood-dark), 0 12px 25px rgba(0,0,0,0.3);
    transition: transform 0.25s ease;
    position: relative;
  }
  .combat-card:hover {
    transform: translateY(-15px) scale(1.04);
    box-shadow: 0 14px 0 var(--wood-dark), 0 18px 30px rgba(0,0,0,0.35);
  }

  .card-cost {
    background: var(--gold);
    color: var(--text-brown);
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 14px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid var(--wood-border);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card-type { font-size: 10px; font-weight: 800; color: var(--wood-dark); text-transform: uppercase; }
  .card-body { text-align: center; }
  .card-icon { font-size: 38px; margin-bottom: 4px; }
  .card-title { font-family: 'Baloo 2', sans-serif; font-size: 13px; font-weight: 800; color: var(--wood-border); line-height: 1.2; }
  .card-desc { font-size: 10px; color: #614631; text-align: center; line-height: 1.2; }

  .right-controls { display: flex; align-items: center; gap: 15px; }
  .deck-pile {
    background: var(--wood-main);
    border: 4px solid var(--wood-border);
    border-radius: 12px;
    padding: 10px 14px;
    text-align: center;
    font-family: 'Baloo 2', sans-serif;
    font-size: 13px;
    color: var(--cream-bg);
    box-shadow: 0 6px 0 var(--wood-dark);
  }

  .end-turn-btn {
    background: var(--green-accent);
    border: 4px solid var(--wood-border);
    width: 75px;
    height: 75px;
    border-radius: 50%;
    color: white;
    font-size: 26px;
    cursor: pointer;
    box-shadow: 0 6px 0 var(--wood-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.1s ease;
  }
  .end-turn-btn:hover { transform: scale(1.05); }
  .end-turn-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--wood-dark); }

  /* --- pixel fighters --- */
  .mc-fighter-card { background: none; border: none; box-shadow: none; padding: 0; }
  .fighter-icon { min-height: 0; }
  .fighter-name { background: var(--wood-main); border: 3px solid var(--wood-border); border-radius: 10px; padding: 2px 14px; color: var(--cream-bg); display: inline-block; }
  .pix { image-rendering: pixelated; filter: drop-shadow(0 10px 8px rgba(0,0,0,0.35)); }
  .lunge { animation: lunge 0.5s ease-out; }
  @keyframes lunge { 0%,100% { transform: translateX(0); } 40% { transform: translateX(70px) scale(1.06); } }
  .ult { animation: ult 0.6s ease-out; }
  @keyframes ult { 0%,100% { transform: scale(1); } 40% { transform: scale(1.18) translateY(-10px); filter: drop-shadow(0 0 22px #ffe04a) brightness(1.2); } }
  .enemy-avatar .pix { transform: scaleX(-1); }

  .battlefield { background-size: cover; background-position: center; image-rendering: pixelated; }
  .battlefield::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle, transparent 45%, rgba(0,0,0,.5)); pointer-events: none; z-index: 1; }
  #fxLayer { position: absolute; inset: 0; z-index: 30; pointer-events: none; overflow: hidden; }
  .fx { position: absolute; font-family: 'Baloo 2'; font-weight: 800; text-shadow: 2px 2px 0 #000; transform: translate(-50%,-50%); animation: fxMove ease-out forwards; }
  @keyframes fxMove { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.4); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.3) rotate(90deg); } }
  .ring { position: absolute; border: 8px solid var(--c); box-sizing: border-box; transform: translate(-50%,-50%) scale(.1); opacity: 1; animation: ring var(--d) ease-out forwards; }
  @keyframes ring { to { transform: translate(-50%,-50%) scale(1); opacity: 0; } }
  .beam { position: absolute; transform-origin: left center; background: repeating-linear-gradient(90deg, var(--c) 0 14px, #fff 14px 20px); box-shadow: 0 0 16px var(--c); animation: beam var(--d) ease-out forwards; }
  @keyframes beam { 0% { transform: scaleX(0); opacity: 1; } 55% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
  .flash { position: absolute; inset: 0; background: var(--c); animation: flash var(--d) ease-out forwards; }
  @keyframes flash { 0% { opacity: .85; } 100% { opacity: 0; } }
  .slash { position: absolute; width: 190px; height: 16px; background: linear-gradient(90deg, transparent, #fff, #ffe04a, transparent); box-shadow: 0 0 14px #fff; transform: translate(-50%,-50%) rotate(-35deg); animation: slash .32s ease-out forwards; }
  .slash.red { background: linear-gradient(90deg, transparent, #fff, #ff3d3d, transparent); box-shadow: 0 0 14px #f33; }
  @keyframes slash { 0% { clip-path: inset(0 100% 0 0); opacity: 1; } 60% { clip-path: inset(0 0 0 0); opacity: 1; } 100% { clip-path: inset(0 0 0 0); opacity: 0; } }
  .banner { position: absolute; left: 50%; top: 36%; white-space: nowrap; font: 800 68px 'Baloo 2'; color: #ffe04a; -webkit-text-stroke: 3px #422413; text-shadow: 5px 5px 0 #422413; animation: banner 1.3s ease-out forwards; }
  @keyframes banner { 0% { opacity: 0; transform: translate(-50%,-50%) scale(2.2); } 15% { opacity: 1; transform: translate(-50%,-50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-80%) scale(1); } }
  #playerAvatarIcon { transition: filter .2s; }
  .glow-blue { filter: drop-shadow(0 0 18px #5cc8ff) brightness(1.25); } .glow-green { filter: drop-shadow(0 0 18px #6bff8a) brightness(1.2); } .glow-red { filter: drop-shadow(0 0 18px #ff5a3d) brightness(1.2); }
  .elunge { animation: elunge .5s ease-out; } @keyframes elunge { 40% { transform: translateX(-230px) scale(1.1); } }
  .enemy-avatar.dead { opacity: 0; transform: scale(.4) translateY(40px); transition: all .6s; }

  #fighterPick { position: absolute; inset: 0; z-index: 60; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: rgba(20,10,30,.88); }
  #fighterPick h2 { margin: 0; font: 800 30px 'Baloo 2'; color: var(--cream-bg); text-shadow: 3px 3px 0 var(--wood-border); }
  .pick-grid { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; max-width: 900px; padding: 0 20px; }
  .pick-card { width: 150px; background: var(--cream-bg); border: 4px solid var(--wood-border); border-radius: 14px; padding: 8px 8px 10px; text-align: center; cursor: pointer; box-shadow: 0 6px 0 var(--wood-dark); transition: transform .2s; animation: popBtn .35s cubic-bezier(.2,1.5,.4,1) both; }
  .pick-card:hover { transform: translateY(-8px) scale(1.04); }
  .pick-card.Legendary { border-color: var(--legendary, #ffaa00); } .pick-card.Rare { border-color: #9933ff; } .pick-card.Common { border-color: #3399ff; }
  .pick-card .pn { font: 800 16px 'Baloo 2'; color: var(--wood-border); }
  .pick-card .ps { font-size: 10px; color: #614631; min-height: 26px; line-height: 1.2; margin-top: 2px; }
  .pick-card .pb { height: 10px; background: #422413; border-radius: 5px; overflow: hidden; margin-top: 4px; }
  .pick-card .pb i { display: block; height: 100%; background: var(--green-accent); }
  .pick-card .pt { font-size: 11px; font-weight: 800; color: var(--wood-dark); }
  @keyframes popBtn { from { transform: scale(.6) translateY(20px); opacity: 0; } }

  .end-turn-btn.pulse { animation: endPulse .9s ease-in-out infinite; }
  @keyframes endPulse { 50% { transform: scale(1.14); box-shadow: 0 0 0 8px rgba(230,184,76,.45), 0 6px 0 var(--wood-dark); } }

  #resultScreen { position: absolute; inset: 0; z-index: 70; display: none; align-items: center; justify-content: center; background: rgba(15,8,28,.82); overflow: hidden; }
  .res-card { position: relative; z-index: 2; width: min(460px, 92vw); background: var(--cream-bg); border: 5px solid var(--wood-border); border-radius: 20px; padding: 22px 28px 26px; text-align: center; box-shadow: 0 12px 0 var(--wood-dark), 0 0 60px rgba(230,184,76,.35); animation: resPop .5s cubic-bezier(.2,1.4,.4,1); }
  .res-card.lose { box-shadow: 0 12px 0 var(--wood-dark), 0 0 60px rgba(217,83,79,.4); }
  @keyframes resPop { from { transform: scale(.6) translateY(40px); opacity: 0; } }
  .res-title { font: 800 34px 'Baloo 2'; color: #c98a14; text-shadow: 2px 2px 0 var(--wood-border); } .lose .res-title { color: var(--danger); }
  .res-stars { font-size: 44px; letter-spacing: 6px; height: 56px; } .res-stars span { display: inline-block; animation: starIn .5s both; color: #e6b84c; text-shadow: 2px 2px 0 var(--wood-border); } .res-stars span.off { color: #cbbfa8; }
  @keyframes starIn { from { transform: scale(0) rotate(-200deg); opacity: 0; } 70% { transform: scale(1.5); } }
  .res-sub { font-size: 13px; color: #614631; font-weight: 700; margin: 4px 0 12px; }
  .res-row { display: flex; justify-content: space-between; align-items: center; background: var(--wood-main); border: 3px solid var(--wood-border); border-radius: 10px; padding: 8px 14px; margin-top: 8px; color: var(--cream-bg); font: 800 18px 'Baloo 2'; animation: rowIn .4s both; }
  .res-row em { font-style: normal; font-size: 11px; background: var(--gold); color: var(--text-brown); border-radius: 6px; padding: 1px 7px; margin-left: 8px; }
  @keyframes rowIn { from { transform: translateX(-40px); opacity: 0; } }
  .res-total { margin-top: 12px; font: 700 13px 'Quicksand'; color: #614631; }
  .res-btns { display: flex; gap: 12px; justify-content: center; margin-top: 18px; }
  .res-btn { background: var(--gold); border: 4px solid var(--wood-border); border-radius: 12px; padding: 10px 24px; font: 800 17px 'Baloo 2'; color: var(--text-brown); cursor: pointer; box-shadow: 0 5px 0 var(--wood-dark); }
  .res-btn.alt { background: var(--wood-light); } .res-btn:hover { transform: translateY(-3px); } .res-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--wood-dark); }
  .cfall { position: absolute; top: 0; z-index: 1; animation: cfall linear infinite; } @keyframes cfall { from { transform: translateY(-12vh) rotate(0); } to { transform: translateY(112vh) rotate(720deg); } }
</style>
</head>
<body>

<div class="battlefield" id="battlefield">
  <div id="attackProjectile">☕</div>
  <div id="fxLayer"></div>
  <div id="fighterPick"></div>
  <div id="resultScreen"><div class="res-card" id="resCard"></div></div>

  <div class="top-hud">
    <div style="display: flex; align-items: center; gap: 12px;">
      <span style="font-size: 24px;" id="fIcon">☕</span>
      <div>
        <div style="font-family: 'Baloo 2', sans-serif; font-size: 14px; font-weight: 800; color: var(--cream-bg);" id="playerHpLabel">Kairo HP</div>
        <div class="hp-bar-container"><div id="playerHpBar" class="hp-fill"></div></div>
      </div>
    </div>

    <div id="combatLog" style="font-size: 13px; color: var(--cream-bg); font-weight: 700;">
      Encountered Anomaly! Watch the Enemy Action Counter!
    </div>

    <div style="text-align: right;">
      <div id="enemyName" style="font-family: 'Baloo 2', sans-serif; font-size: 14px; font-weight: 800; color: var(--cream-bg);">Void Anomaly</div>
      <div class="hp-bar-container"><div id="enemyHpBar" class="enemy-hp-fill"></div></div>
    </div>
  </div>

  <div class="combat-stage">
    <div class="mc-fighter-card" id="mcCard">
      <div class="fighter-icon" id="playerAvatarIcon">☕</div>
      <div class="fighter-name" id="fName">Kairo</div>
    </div>

    <div class="enemy-stage">
      <div class="enemy-intent-badge" id="intentBadge">
        <span class="intent-icon">⚔️</span>
        <span class="intent-countdown" id="enemyActionCount">3</span>
      </div>
      <div id="floatingText">-30</div>
      <div class="enemy-avatar" id="enemyAvatar">👾</div>
    </div>
  </div>

  <div class="bottom-hud">
    <div class="ep-meter">
      <div style="font-size: 10px; color: var(--cream-bg); font-weight: bold; letter-spacing: 1px;">EP ENERGY</div>
      <div class="ep-number" id="currentEp">3</div>
    </div>

    <div class="card-hand" id="cardHand"></div>

    <div class="right-controls">
      <div class="deck-pile">📚 DECK<br><span id="deckCount" style="font-size: 16px; color: var(--gold);" title="Cards left in your draw pile / cards in your whole deck">--</span></div>
      <div><button class="end-turn-btn" onclick="endPlayerTurn()" title="End Turn">✔</button></div>
    </div>
  </div>
</div>

<script src="campaign.js"></script>
<script src="help.js"></script>
<script src="cloud.js"></script>
<script src="music.js"></script>
<script>
  let playerHp = 150, maxPlayerHp = 150;
  const NODE = CC.node(localStorage.getItem('current_node') || 'ch1_1');
  let waveIdx = 0, enemyHp = NODE.hp, maxEnemyHp = NODE.hp;
  let currentEp = 3, maxEp = 3;
  let shield = 0;
  let enemyActionCountdown = 3;

  let atkBuff = 1;
  const deckPool = [
    { name: "Espresso Strike", type: "Attack", cost: 1, icon: "☕", pose: "attack", t: 700, desc: "Fire a coffee bolt for 22 damage.", effect: () => strike(22, "bolt") },
    { name: "Frothy Slash", type: "Attack", cost: 1, icon: "🗡️", pose: "attack", t: 600, desc: "Slash for 18 damage. Gain 6 shield.", effect: () => { strike(18, "slash"); applyShield(6, true); } },
    { name: "Triple Shot", type: "Skill", cost: 1, icon: "💥", pose: "attack", t: 900, desc: "Three quick hits, 27 damage total.", effect: () => strike(27, "multi", 3) },
    { name: "Grande Smash", type: "Skill", cost: 2, icon: "⚡", pose: "attack", t: 900, desc: "Shockwave smash for 40 damage!", effect: () => strike(40, "smash") },
    { name: "Midnight Brew", type: "Ultimate", cost: 3, icon: "🌙", pose: "ultimate", t: 1500, desc: "Unleash the awakened cup: 75 damage!", effect: () => strike(75, "ultimate") },
    { name: "Microfoam Shield", type: "Buff", cost: 1, icon: "🛡️", pose: "idle", t: 700, desc: "Gain 15 protective shield.", effect: () => applyShield(15) },
    { name: "Sugar Rush", type: "Buff", cost: 1, icon: "🔥", pose: "idle", t: 700, desc: "Your next attack deals 50% more.", effect: () => powerUp() },
    { name: "Herbal Recovery", type: "Buff", cost: 1, icon: "🍵", pose: "idle", t: 700, desc: "Restore 25 HP instantly.", effect: () => healPlayer(25) }
  ];

  let currentHand = [];

  // ================= fighters: pick who fights, HP carries over between battles =================
  let FIGHTER = null;
  const HPK = "cafe_clash_hp", REST_HEAL = 0.25, DEFEAT_HP = 0.5;      // after a win everyone heals 25%; after a loss you restart at 50%
  const STATS = { Kairo: { hp: 150, r: "Common" }, Hana: { hp: 150, r: "Common" }, Sora: { hp: 140, r: "Common" }, Mimi: { hp: 135, r: "Rare" }, Ryu: { hp: 170, r: "Rare" }, Yuki: { hp: 130, r: "Rare" }, Lena: { hp: 160, r: "Rare" }, Rei: { hp: 140, r: "Rare" }, Luna: { hp: 130, r: "Rare" }, Akira: { hp: 190, r: "Legendary" } };
  const SIG = {   // each fighter adds a signature card (2 copies) to the deck

  function fxEnemyAttack() {
    const av = $("enemyAvatar"); av.classList.remove("elunge"); void av.offsetWidth; av.classList.add("elunge");
    setTimeout(() => { fxBox("slash red", `left:${P.pl[0]}%;top:${P.pl[1]}%`, 330); burst(P.pl[0], P.pl[1], ["#ff4d4d", "#fff", "#7a0000"], 12, 100); fxBox("flash", "--c:rgba(255,0,0,.35);--d:300ms", 300); shk(); }, 220);
  }
  function fxDeath() { $("enemyAvatar").classList.add("dead"); burst(P.en[0], P.en[1], ["#fff", "#ffd37a", "#f66"], 26, 220); }

  const POSE_FACE = { idle: "neutral", skill: "angry", attack: "angry", ultimate: "happy" };

  function setPlayerPose(pose = "idle") {
    const box = document.getElementById("playerAvatarIcon");
    box.innerHTML = "";
    const img = spriteImg(FIGHTER, getCombatImg(FIGHTER, pose), POSE_FACE[pose] || "neutral", 230);
    if (pose === "ultimate") img.classList.add("ult"); else if (pose !== "idle") img.classList.add("lunge");
    box.appendChild(img);
  }

  function setWave() {
    const w = NODE.waves[waveIdx];
    enemyHp = maxEnemyHp = NODE.hp; enemyActionCountdown = 3;
    document.getElementById("enemyName").innerText = w[0] + (NODE.waves.length > 1 ? " (" + (waveIdx + 1) + "/" + NODE.waves.length + ")" : "");
    
    // Bosses use their character sprite, mobs get a pixel monster (all face left)
    const eAvatar = $("enemyAvatar"); eAvatar.classList.remove("dead"); eAvatar.innerHTML = "";
    const key = resolveLook(w[0]);
    if (key) eAvatar.appendChild(spriteImg(w[0].includes("Final") ? "Akira" : key, key === "Overcharged Kairo" ? "" : getCombatImg(key, "idle"), /Awakened|Final|Overcharged/.test(w[0]) ? "angry" : "neutral", 230));
    else { const m = new Image(); m.className = "pix"; m.style.height = "200px"; m.src = drawMob(w[0]); eAvatar.appendChild(m); }
    updateUi();
  }

  function onEnemyDown() {
    fxDeath();
    if (waveIdx < NODE.waves.length - 1) {
      waveIdx++;
      document.getElementById("combatLog").innerText = "Enemy down! Next foe approaches...";
      setTimeout(() => { setWave(); currentEp = maxEp; drawNewHand(); updateUi(); }, 700);
    } else {
      document.getElementById("combatLog").innerText = "Victory!";
      setTimeout(showVictory, 900);
    }
  }

  function drawNewHand() {
    discardPile.push(...currentHand); currentHand = [];
    while (currentHand.length < 4) {
      if (!drawPile.length) { if (!discardPile.length) break; drawPile = shuffle(discardPile); discardPile = []; }
      currentHand.push(drawPile.pop());
    }
    deckLabel(); renderHand();
  }

  function renderHand() {
    let handContainer = document.getElementById("cardHand");
    handContainer.innerHTML = "";
    currentHand.forEach((card, index) => {
      let cardEl = document.createElement("div");
      cardEl.className = "combat-card";
      if (card.cost > currentEp) { cardEl.style.opacity = "0.5"; cardEl.style.cursor = "not-allowed"; }
      cardEl.innerHTML = `
        <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
          <div class="card-cost">${card.cost}</div>
          <div class="card-type">${card.type}</div>
        </div>
        <div class="card-body">
          <div class="card-icon">${card.icon}</div>
          <div class="card-title">${card.name}</div>
        </div>
        <div class="card-desc">${card.desc}</div>
      `;
      if (card.cost <= currentEp) { cardEl.onclick = () => playCard(index); }
      handContainer.appendChild(cardEl);
    });
    const stuck = !currentHand.some(cd => cd.cost <= currentEp);
    document.querySelector(".end-turn-btn").classList.toggle("pulse", stuck);
  }

  function playCard(index) {
    const card = currentHand[index];
    if (currentEp < card.cost) return;
    currentEp -= card.cost;
    setPlayerPose(card.pose);
    if (card.pose !== "idle") setTimeout(() => setPlayerPose("idle"), card.t);
    card.effect();
    discardPile.push(currentHand.splice(index, 1)[0]);
    enemyActionCountdown = Math.max(0, enemyActionCountdown - 1);
    updateUi(); renderHand();
    if (enemyActionCountdown === 0) {
      $("combatLog").innerText = "⚠️ Enemy action triggered! Counter-attacking!";
      setTimeout(() => triggerEnemyAttack(), card.t + 300);
    }
  }

  function strike(amount, kind, hits = 1) {
    amount = Math.round(amount * atkBuff * levelAtk()); atkBuff = 1;
    const per = Math.round(amount / hits), first = { bolt: 300, slash: 150, multi: 200, smash: 350, ultimate: 800 }[kind] || 300;
    fxCast(kind);
    for (let i = 0; i < hits; i++) setTimeout(() => {
      fxHit(kind, i);
      enemyHp = Math.max(0, enemyHp - per); updateUi();
      const av = $("enemyAvatar"); av.classList.add("hit"); setTimeout(() => av.classList.remove("hit"), 250);
      if (kind !== "ultimate") shk(200);
      showFloatingText("-" + per, "var(--gold)");
      if (i === hits - 1) {
        $("combatLog").innerText = `Dealt ${amount} damage! Enemy counter in ${enemyActionCountdown} actions.`;
        if (enemyHp <= 0) onEnemyDown();
      }
    }, first + i * 180);
  }

  function applyShield(amount, quiet) {
    shield += amount; updateUi();
    if (!quiet) { fxBuff("shield"); showFloatingText("+" + amount + " Shield", "#5cc8ff"); $("combatLog").innerText = `Gained ${amount} shield!`; }
  }
  function powerUp() {
    atkBuff = 1.5; fxBuff("power"); updateUi();
    showFloatingText("ATK UP!", "#ff7a3d"); $("combatLog").innerText = "Sugar Rush! Next attack deals 50% more.";
  }
  function healPlayer(amount) {
    playerHp = Math.min(maxPlayerHp, playerHp + amount); fxBuff("heal");
    showFloatingText("+" + amount + " HP", "var(--green-accent)"); $("combatLog").innerText = `Restored ${amount} HP!`; updateUi();
  }

  function showFloatingText(text, color) {
    let ft = document.getElementById("floatingText");
    ft.innerText = text; ft.style.color = color;
    ft.classList.remove("animate-float");
    void ft.offsetWidth;
    ft.classList.add("animate-float");
  }

  function triggerEnemyAttack() {
    if (over || enemyHp <= 0) return;
    let dmg = Math.floor(Math.random() * 8) + NODE.dmg;
    if (shield > 0) {
      if (shield >= dmg) { shield -= dmg; dmg = 0; }
      else { dmg -= shield; shield = 0; }
    }
    fxEnemyAttack();
    playerHp = Math.max(0, playerHp - dmg);
    updateUi();
    let mc = document.getElementById("mcCard");
    mc.style.transform = "translateX(-8px)";
    setTimeout(() => mc.style.transform = "translateX(8px)", 100);
    setTimeout(() => mc.style.transform = "translateX(0)", 200);

    if (playerHp <= 0) {
      defeatRest(); showDefeat();
      return;
    }
    enemyActionCountdown = 3;
    updateUi();
    currentEp = maxEp; drawNewHand(); updateUi();
    document.getElementById("combatLog").innerText = "Enemy counter-attacked! Energy restored and new cards drawn. Your turn.";
  }

  function endPlayerTurn() {
    document.getElementById("combatLog").innerText = "Ending turn... Enemy strikes!";
    setTimeout(() => { triggerEnemyAttack(); }, 600);
  }

  function updateUi() {
    if (FIGHTER) saveHp();
    document.getElementById("currentEp").innerText = currentEp;
    document.getElementById("playerHpBar").style.width = (playerHp / maxPlayerHp) * 100 + "%";
    document.getElementById("enemyHpBar").style.width = (enemyHp / maxEnemyHp) * 100 + "%";
    document.getElementById("enemyActionCount").innerText = enemyActionCountdown;
    document.getElementById("playerHpLabel").innerHTML = FIGHTER + " HP " + playerHp + "/" + maxPlayerHp + (shield > 0 ? "  🛡️ " + shield : "") + (atkBuff > 1 ? "  🔥 ATK x" + atkBuff : "");
  }

  HELP.once(startPick);
</script>
</body>
</html>
