<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Café Clash: Midnight Brew — Brew Station</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Quicksand:wght@600;750&display=swap" rel="stylesheet">
<style>
  :root {
    --wood-dark: #6c4228;
    --wood-main: #b88654;
    --wood-light: #e3bc88;
    --wood-border: #422413;
    --cream-bg: #fdf5e6;
    --green-accent: #7ca968;
    --gold: #e6b84c;
    --legendary: #ffaa00;
    --rare: #9933ff;
    --common: #3399ff;
    --text-brown: #331a0d;
  }
  * { box-sizing: border-box; }
  
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    background: linear-gradient(135deg, #a4c988, #679d67);
    overflow: hidden;
    font-family: 'Quicksand', sans-serif;
    color: var(--text-brown);
    user-select: none;
  }

  .gacha-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 25px 35px;
    background: radial-gradient(circle at 50% 40%, rgba(184, 214, 156, 0.9) 0%, rgba(103, 157, 103, 0.95) 80%);
    overflow: hidden;
  }

  .top-hud {
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--wood-main);
    border: 4px solid var(--wood-border);
    border-radius: 12px;
    padding: 12px 25px;
    box-shadow: 0 6px 0 var(--wood-dark), 0 10px 20px rgba(0,0,0,0.3);
  }

  .resource-badge {
    background: var(--wood-dark);
    border: 2px solid var(--wood-border);
    padding: 4px 14px;
    border-radius: 8px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 15px;
    color: var(--cream-bg);
  }

  .gacha-center {
    position: relative;
    z-index: 5;
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 20px;
  }

  .grinder-machine-card {
    background: var(--cream-bg);
    border: 4px solid var(--wood-border);
    border-radius: 24px;
    padding: 30px 60px;
    text-align: center;
    box-shadow: 0 10px 0 var(--wood-dark), 0 20px 40px rgba(0,0,0,0.3);
  }

  .grinder-icon { font-size: 90px; animation: grinderPulse 3s ease-in-out infinite; }
  @keyframes grinderPulse {
    0%, 100% { transform: scale(1) rotate(0deg); }
    50% { transform: scale(1.05) rotate(3deg); }
  }

  .grinder-title { font-family: 'Baloo 2', sans-serif; font-size: 24px; font-weight: 800; color: var(--wood-border); margin-top: 10px; }
  .grinder-rates { font-size: 12px; font-weight: 700; color: #614631; margin-top: 4px; }

  .pull-actions { display: flex; gap: 20px; margin-top: 10px; }

  .pull-btn {
    background: var(--gold);
    border: 4px solid var(--wood-border);
    border-radius: 14px;
    padding: 12px 28px;
    font-family: 'Baloo 2', sans-serif;
    font-size: 16px;
    font-weight: 800;
    color: var(--text-brown);
    cursor: pointer;
    box-shadow: 0 6px 0 var(--wood-dark), 0 10px 20px rgba(0,0,0,0.25);
    transition: transform 0.15s ease;
  }
  .pull-btn:hover { transform: translateY(-4px); background: #f0c455; }
  .pull-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--wood-dark); }

  .result-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(4px);
    z-index: 20;
    display: none;
    justify-content: center;
    align-items: center;
  }

  .result-card {
    background: var(--cream-bg);
    border: 4px solid var(--wood-border);
    border-radius: 20px;
    padding: 30px 45px;
    text-align: center;
    box-shadow: 0 12px 0 var(--wood-dark), 0 25px 50px rgba(0,0,0,0.4);
    animation: popIn 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
  }
  @keyframes popIn {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .result-rarity { font-family: 'Baloo 2', sans-serif; font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }

  .wood-btn {
    background: var(--wood-dark);
    border: 2px solid var(--wood-border);
    color: var(--wood-light);
    padding: 6px 14px;
    border-radius: 8px;
    font-family: 'Baloo 2', sans-serif;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 0 var(--wood-border);
  }

  .pix { image-rendering: pixelated; filter: drop-shadow(0 6px 5px rgba(0,0,0,0.3)); }
  .pity { font-size: 12px; font-weight: 700; color: var(--cream-bg); text-shadow: 0 1px 3px rgba(0,0,0,.5); }
  .collection { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 780px; }
  .slot { position: relative; width: 66px; height: 96px; background: var(--cream-bg); border: 3px solid var(--wood-border); border-radius: 10px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 4px; box-shadow: 0 4px 0 var(--wood-dark); }
  .slot.locked .pix { filter: brightness(0) opacity(.28); }
  .slot .cnt { position: absolute; top: -8px; right: -8px; background: var(--gold); border: 2px solid var(--wood-border); border-radius: 50%; width: 22px; height: 22px; font: 800 11px 'Baloo 2'; display: flex; align-items: center; justify-content: center; }
  .slot.Legendary { border-color: var(--legendary); } .slot.Rare { border-color: var(--rare); }
  .new-tag { font-family: 'Baloo 2'; font-weight: 800; color: #d33; font-size: 15px; height: 18px; }
  #resIcon { height: 190px; display: flex; justify-content: center; align-items: flex-end; }

  /* ---- page animations ---- */
  .top-hud { animation: slideDown .5s ease-out; }
  .grinder-machine-card { position: relative; animation: floatIn .6s cubic-bezier(.2,1.2,.4,1) both; }
  .grinder-machine-card:hover { animation: wiggle .5s; }
  @keyframes slideDown { from { transform: translateY(-40px); opacity: 0; } }
  @keyframes floatIn { from { transform: translateY(50px) scale(.9); opacity: 0; } }
  @keyframes wiggle { 25% { transform: rotate(-2deg); } 75% { transform: rotate(2deg); } }
  #bgBeans { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  #bgBeans i { position: absolute; bottom: -30px; background: rgba(255,255,255,.28); animation: beanUp linear infinite; }
  @keyframes beanUp { 0% { transform: translateY(0) rotate(0); opacity: 0; } 15%,85% { opacity: .6; } 100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; } }
  .steam { position: absolute; top: 14px; left: 50%; }
  .steam i { position: absolute; width: 12px; height: 12px; background: #fff; opacity: 0; animation: steam 2.4s ease-out infinite; }
  .steam i:nth-child(1) { left: -26px; } .steam i:nth-child(2) { left: 0; animation-delay: .8s; } .steam i:nth-child(3) { left: 24px; animation-delay: 1.6s; }
  @keyframes steam { 0% { opacity: 0; transform: translateY(0) scale(.6); } 30% { opacity: .8; } 100% { opacity: 0; transform: translateY(-50px) scale(1.6); } }
  .pull-btn { position: relative; overflow: hidden; }
  .pull-btn::after { content: ""; position: absolute; top: 0; left: -60%; width: 40%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.65), transparent); transform: skewX(-20deg); animation: shine 3s infinite; }
  @keyframes shine { 60%,100% { left: 140%; } }
  .nope { animation: nope .4s; } @keyframes nope { 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
  .toast { position: absolute; top: 92px; left: 50%; transform: translateX(-50%); z-index: 50; background: #d9534f; color: #fff; border: 3px solid var(--wood-border); border-radius: 10px; padding: 8px 18px; font: 800 15px 'Baloo 2'; opacity: 0; pointer-events: none; }
  .toast.show { animation: toastIn 1.6s forwards; } @keyframes toastIn { 0% { opacity: 0; transform: translate(-50%,-20px); } 12%,80% { opacity: 1; transform: translate(-50%,0); } 100% { opacity: 0; } }
  .resource-badge.bump { animation: bump .4s; } @keyframes bump { 40% { transform: scale(1.25); background: #8a5a35; } }
  .slot.in { animation: slotIn .4s cubic-bezier(.2,1.4,.4,1) both; } @keyframes slotIn { from { transform: scale(0) rotate(-20deg); opacity: 0; } }
  .slot.got { animation: got 1.4s ease-out 2; } @keyframes got { 0%,100% { transform: scale(1); } 30% { transform: scale(1.25); box-shadow: 0 0 24px 6px var(--gold); } }
  .slot.Legendary:not(.locked) { animation: legend 2s linear infinite; } @keyframes legend { 50% { box-shadow: 0 4px 0 var(--wood-dark), 0 0 16px 3px var(--legendary); } }

  /* ---- pull sequence ---- */
  .result-overlay { overflow: hidden; background: radial-gradient(circle, rgba(30,15,50,.9), rgba(0,0,0,.95)); backdrop-filter: none; }
  .rays { position: absolute; width: 170vmax; height: 170vmax; left: 50%; top: 50%; margin: -85vmax 0 0 -85vmax; background: repeating-conic-gradient(var(--c) 0 7deg, transparent 7deg 22deg); -webkit-mask-image: radial-gradient(circle, #000 4%, transparent 52%); mask-image: radial-gradient(circle, #000 4%, transparent 52%); opacity: 0; animation: spin 16s linear infinite; }
  .rays.on { opacity: .6; transition: opacity .5s; } @keyframes spin { to { transform: rotate(360deg); } }
  .orb { position: absolute; width: 70px; height: 70px; border-radius: 50%; background: var(--c); box-shadow: 0 0 40px var(--c), 0 0 100px var(--c); animation: orbPulse .4s infinite alternate; transition: transform 1s cubic-bezier(.5,0,.2,1), background .3s; }
  .orb.grow { transform: scale(4); } @keyframes orbPulse { to { filter: brightness(1.5); } }
  .anim-grinder { position: absolute; font-size: 130px; z-index: 2; animation: grind .12s infinite alternate; }
  .anim-grinder.hard { animation: grind .05s infinite alternate; filter: drop-shadow(0 0 24px #fff); }
  @keyframes grind { from { transform: translate(-3px,1px) rotate(-4deg); } to { transform: translate(3px,-1px) rotate(4deg); } }
  .bean { position: absolute; z-index: 3; width: 14px; height: 14px; background: #6b3a1e; border: 2px solid #3a1d0c; animation: beanFall .7s ease-in forwards; }
  @keyframes beanFall { from { transform: translateY(-260px) rotate(0); opacity: 1; } to { transform: translateY(-30px) rotate(300deg); opacity: 0; } }
  .flashw { position: absolute; inset: 0; background: var(--c); opacity: 0; pointer-events: none; z-index: 6; }
  .flashw.go { animation: flashw .8s ease-out; } @keyframes flashw { 0% { opacity: 1; } 100% { opacity: 0; } }
  .cf { position: absolute; left: 50%; top: 50%; z-index: 7; pointer-events: none; animation: cf 1.5s cubic-bezier(.15,.8,.3,1) forwards; }
  @keyframes cf { 0% { transform: translate(0,0) scale(1); opacity: 1; } 80% { opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) rotate(540deg) scale(.6); opacity: 0; } }
  .rring { position: absolute; left: 50%; top: 50%; border: 6px solid var(--c); border-radius: 50%; transform: translate(-50%,-50%) scale(.1); animation: rring 1.2s ease-out forwards; z-index: 5; }
  @keyframes rring { to { transform: translate(-50%,-50%) scale(1); opacity: 0; } }
  .result-card { position: relative; z-index: 8; min-width: 300px; }
  .stars { font-size: 26px; letter-spacing: 4px; height: 34px; } .stars span { display: inline-block; animation: starPop .45s both; }
  @keyframes starPop { from { transform: scale(0) rotate(-180deg); opacity: 0; } 70% { transform: scale(1.5); } }
  @keyframes fadeUp { from { transform: translateY(18px); opacity: 0; } }
  @keyframes hop { 0% { transform: translateY(80px) scale(.3); opacity: 0; filter: brightness(0); } 55% { transform: translateY(-30px) scale(1.15); opacity: 1; filter: brightness(0); } 70% { filter: brightness(1.8); } 100% { transform: translateY(0) scale(1); filter: none; } }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  .skip-hint { position: absolute; bottom: 26px; color: #fff; opacity: .6; font: 700 13px 'Baloo 2'; z-index: 9; }
  .shaking { animation: shakeAll .5s; } @keyframes shakeAll { 20% { transform: translate(-8px,5px); } 40% { transform: translate(7px,-6px); } 60% { transform: translate(-5px,-3px); } 80% { transform: translate(4px,6px); } }
</style>
</head>
<body>

<div class="gacha-container" id="gachaBox">
  <div id="bgBeans"></div>
  <div class="toast" id="toast"></div>
  <div class="top-hud">
    <div style="font-family: 'Baloo 2', sans-serif; font-size: 18px; font-weight: 800; color: var(--cream-bg);">☕ BREW STATION (GACHA)</div>
    <div style="display: flex; gap: 15px; align-items: center;">
      <div class="resource-badge">💎 Gems: <span id="gemCount">150</span></div>
      <button class="wood-btn" onclick="window.location.href='map.html'">🗺️ Return to Map</button>
    </div>
  </div>

  <div class="gacha-center">
    <div class="grinder-machine-card">
      <div class="steam"><i></i><i></i><i></i></div>
      <div class="grinder-icon">⚙️</div>
      <div class="grinder-title">Magical Coffee Grinder</div>
      <div class="grinder-rates">Legendary: 3% | Rare: 27% | Common: 70%</div>
      <div class="grinder-rates" id="pityText"></div>
    </div>

    <div class="pull-actions">
      <button class="pull-btn" id="pullBtn" onclick="pullCharacter()">☕ Brew 1 Pull (50 Gems)</button>
    </div>
    <div class="collection" id="collection"></div>
  </div>

  <div class="result-overlay" id="resultOverlay" onclick="overlayClick()">
    <div class="rays" id="rays"></div>
    <div class="orb" id="orb"></div>
    <div class="anim-grinder" id="animGrinder">⚙️</div>
    <div class="flashw" id="flashw"></div>
    <div class="result-card" id="resCard" onclick="event.stopPropagation()">
      <div class="result-rarity" id="resRarity">Rare</div>
      <div class="stars" id="resStars"></div>
      <div class="new-tag" id="resNew"></div>
      <div id="resIcon"></div>
      <div style="font-family: 'Baloo 2', sans-serif; font-size: 24px; font-weight: 800; color: var(--wood-border); margin-top: 5px;" id="resName">Mimi</div>
      <div style="font-size: 13px; color: #614631; margin-top: 2px;" id="resDesc">Pastry Chef</div>
      <button class="wood-btn" style="margin-top: 20px; width: 100%; padding: 10px;" onclick="closeResult()">Awesome!</button>
    </div>
    <div class="skip-hint" id="skipHint">Tap to skip</div>
  </div>
</div>

<script src="campaign.js"></script>
<script>
  const SAVE = "cafe_clash_gacha";
  const st = JSON.parse(localStorage.getItem(SAVE) || "null") || { gems: 150, owned: {}, pity: 0 };
  const save = () => localStorage.setItem(SAVE, JSON.stringify(st));
  const roster = [
    { name: "Kairo", rarity: "Common", icon: "☕", job: "Barista", type: "Giant Coffee Cup" },
    { name: "Hana", rarity: "Common", icon: "🧹", job: "Café Cleaner", type: "Mop Spear" },
    { name: "Sora", rarity: "Common", icon: "📦", job: "Delivery Staff", type: "Delivery Box" },
    { name: "Mimi", rarity: "Rare", icon: "🧁", job: "Pastry Chef", type: "Whisk Rapier" },
    { name: "Ryu", rarity: "Rare", icon: "🍳", job: "Head Chef", type: "Iron Wok" },
    { name: "Yuki", rarity: "Rare", icon: "🧋", job: "Milk Tea Staff", type: "Boba Cannon" },
    { name: "Lena", rarity: "Rare", icon: "🥖", job: "Baker", type: "Rolling Pin Hammer" },
    { name: "Rei", rarity: "Rare", icon: "🧾", job: "Cashier", type: "Golden Tray" },
    { name: "Luna", rarity: "Rare", icon: "🎤", job: "Café Performer", type: "Moonlight Mic" },
    { name: "Akira", rarity: "Legendary", icon: "👔", job: "Café Manager", type: "Espresso Core" }
  ];

  const $ = id => document.getElementById(id);
  const COL = { Common: "#3399ff", Rare: "#9933ff", Legendary: "#ffaa00" }, STARS = { Common: 3, Rare: 4, Legendary: 5 };
  let busy = false, phase = 0, pending = null, timers = [], shown = st.gems, firstRender = true;
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  const rand = (a, b) => a + Math.random() * (b - a);

  function toast(m) { const t = $("toast"); t.textContent = m; t.classList.remove("show"); void t.offsetWidth; t.classList.add("show"); }
  function setGems(n) {
    const from = shown, t0 = performance.now(), el = $("gemCount"), badge = el.parentNode;
    badge.classList.remove("bump"); void badge.offsetWidth; badge.classList.add("bump");
    (function step(t) { const k = Math.min(1, (t - t0) / 500); shown = Math.round(from + (n - from) * k); el.textContent = shown; if (k < 1) requestAnimationFrame(step); })(t0);
  }

  function pullCharacter() {
    if (busy) return;
    if (st.gems < 50) { const b = $("pullBtn"); b.classList.remove("nope"); void b.offsetWidth; b.classList.add("nope"); toast("Not enough Gems!"); return; }
    st.gems -= 50; st.pity++;
    let roll = Math.random() * 100;
    if (st.pity >= 10 && roll >= 30) roll = 3 + Math.random() * 27;   // pity: guaranteed Rare or better
    if (roll < 30) st.pity = 0;
    const pool = roster.filter(x => x.rarity === (roll < 3 ? "Legendary" : roll < 30 ? "Rare" : "Common"));
    const char = pool[Math.floor(Math.random() * pool.length)];
    const isNew = !st.owned[char.name];
    st.owned[char.name] = (st.owned[char.name] || 0) + 1;
    save(); setGems(st.gems);
    pending = { char, isNew };
    startAnim(char);
  }

  function startAnim(char) {
    busy = true; phase = 1;
    const ov = $("resultOverlay"), g = $("animGrinder"), orb = $("orb");
    ov.style.display = "flex"; $("resCard").style.display = "none"; $("skipHint").style.display = "block";
    $("rays").classList.remove("on");
    g.style.display = "block"; g.className = "anim-grinder";
    orb.style.display = "block"; orb.className = "orb"; orb.style.setProperty("--c", "#fff");
    for (let i = 0; i < 16; i++) later(() => {
      const b = document.createElement("div"); b.className = "bean";
      b.style.cssText = `left:calc(50% + ${rand(-50, 50)}px);top:50%`; ov.appendChild(b); setTimeout(() => b.remove(), 750);
    }, i * 65);
    later(() => { orb.classList.add("grow"); orb.style.setProperty("--c", COL[char.rarity]); g.classList.add("hard"); if (char.rarity !== "Common") ring(COL[char.rarity]); }, 1100);
    later(reveal, 2000);
  }

  function ring(col) { const r = document.createElement("div"); r.className = "rring"; r.style.cssText = `width:${rand(300, 420)}px;height:${rand(300, 420)}px;--c:${col}`; $("resultOverlay").appendChild(r); setTimeout(() => r.remove(), 1300); }

  function reveal() {
    if (phase !== 1) return;
    timers.forEach(clearTimeout); timers = []; phase = 2;
    const { char, isNew } = pending, col = COL[char.rarity], leg = char.rarity === "Legendary";
    $("animGrinder").style.display = "none"; $("orb").style.display = "none"; $("skipHint").style.display = "none";
    const fl = $("flashw"); fl.style.setProperty("--c", leg ? "#ffe9a0" : "#fff"); fl.classList.remove("go"); void fl.offsetWidth; fl.classList.add("go");
    $("rays").style.setProperty("--c", col); $("rays").classList.add("on");

    const r = $("resRarity"); r.innerText = char.rarity; r.style.color = col;
    $("resStars").innerHTML = Array.from({ length: STARS[char.rarity] }, (_, i) => `<span style="color:${col};animation-delay:${0.6 + i * 0.13}s">★</span>`).join("");
    $("resNew").innerText = isNew ? "✨ NEW! ✨" : "Duplicate ×" + st.owned[char.name];
    const box = $("resIcon"); box.innerHTML = "";
    const img = spriteImg(char.name, getStoryImg(char.name, "happy"), "happy", 180);
    img.style.animation = "hop .9s .25s both, bob 2s 1.2s ease-in-out infinite"; box.appendChild(img);
    $("resName").innerText = char.name; $("resDesc").innerText = char.job + " — " + char.type;
    const card = $("resCard"); card.style.display = "block"; card.style.borderColor = col;
    card.style.boxShadow = `0 12px 0 var(--wood-dark), 0 0 ${leg ? 90 : 50}px ${col}`;
    [...card.children].forEach((el, i) => { if (el.id === "resIcon") return; el.style.animation = "none"; void el.offsetWidth; el.style.animation = `fadeUp .45s ${0.15 + i * 0.12}s both`; });

    const n = leg ? 110 : char.rarity === "Rare" ? 55 : 28, cols = [col, "#fff", "#ffe04a", leg ? "#ff9f43" : col];
    for (let i = 0; i < n; i++) {
      const c = document.createElement("div"), s = rand(6, 14); c.className = "cf";
      c.style.cssText = `width:${s}px;height:${s}px;background:${cols[i % cols.length]};--dx:${rand(-480, 480)}px;--dy:${rand(-380, 320)}px;animation-delay:${rand(0, .25)}s`;
      $("resultOverlay").appendChild(c); setTimeout(() => c.remove(), 1900);
    }
    if (leg) { for (let k = 0; k < 4; k++) setTimeout(() => ring(col), k * 220); $("gachaBox").classList.add("shaking"); setTimeout(() => $("gachaBox").classList.remove("shaking"), 500); }
    render(char.name);
    later(() => { phase = 3; }, 900);
  }

  function overlayClick() { if (phase === 1) reveal(); else if (phase === 3) closeResult(); }
  function closeResult() { if (phase < 3) return; $("resultOverlay").style.display = "none"; phase = 0; busy = false; }

  function render(newName) {
    $("gemCount").innerText = shown;
    $("pityText").innerText = "Rare or better guaranteed in " + Math.max(1, 10 - st.pity) + " pull(s)";
    const col = $("collection"); col.innerHTML = "";
    roster.forEach((r, i) => {
      const n = st.owned[r.name] || 0, d = document.createElement("div");
      d.className = "slot " + r.rarity + (n ? "" : " locked") + (firstRender ? " in" : "") + (r.name === newName ? " got" : "");
      if (firstRender) d.style.animationDelay = i * 60 + "ms";
      d.title = n ? r.name : "???";
      d.appendChild(spriteImg(r.name, getStoryImg(r.name, "neutral"), "neutral", 72));
      if (n > 1) { const b = document.createElement("div"); b.className = "cnt"; b.textContent = "×" + n; d.appendChild(b); }
      col.appendChild(d);
    });
    firstRender = false;
  }

  // floating background beans
  (function () { const box = $("bgBeans"); for (let i = 0; i < 22; i++) { const b = document.createElement("i"), s = rand(8, 20); b.style.cssText = `left:${rand(0, 100)}vw;width:${s}px;height:${s * .75}px;animation-duration:${rand(7, 13)}s;animation-delay:${rand(0, 8)}s`; box.appendChild(b); } })();
  render();
</script>
